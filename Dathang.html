<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Đặt hàng - Acc free free Q$V</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 40px 10px;
    }

    .checkout-container {
      max-width: 800px;
      margin: auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      padding: 25px 30px;
    }

    h2 {
      text-align: center;
      color: #d4af37;
      font-size: 26px;
      margin-bottom: 25px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    th, td {
      padding: 10px;
      text-align: center;
      border-bottom: 1px solid #eee;
    }

    th {
      background: #111;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    td img {
      width: 90px;
      height: 60px;
      object-fit: cover;
      border-radius: 6px;
    }

    .total {
      text-align: right;
      font-weight: bold;
      font-size: 18px;
      color: #d4af37;
      margin-top: 15px;
    }

    .form-box {
      margin-top: 25px;
    }

    label {
      display: block;
      margin: 8px 0 4px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 10px;
      transition: border 0.3s;
    }

    input:focus {
      border-color: #d4af37;
      outline: none;
    }

    .btn-submit {
      display: block;
      width: 100%;
      background: #d4af37;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background: #b6932b;
    }
  </style>
</head>
<body>
  <div class="checkout-container">
    <h2>Thông tin đặt hàng</h2>

    <div id="orderSummary"></div>

    <div class="form-box">
      <label for="fullname">Họ và tên</label>
      <input type="text" id="fullname" placeholder="Nhập họ và tên của bạn" required>

      <label for="address">Địa chỉ</label>
      <input type="text" id="address" placeholder="Nhập địa chỉ giao hàng" required>

      <label for="phone">Số điện thoại</label>
      <input type="text" id="phone" placeholder="Nhập số điện thoại" required>

      <button class="btn-submit" onclick="submitOrder()">Xác nhận đặt hàng</button>
    </div>
  </div>

  <script>
    // === LẤY GIỎ HÀNG TỪ LOCAL STORAGE ===
    let cart = JSON.parse(localStorage.getItem("CART") || "[]");

    function renderOrderSummary() {
      const box = document.getElementById("orderSummary");
      if (cart.length === 0) {
        box.innerHTML = `<p style="text-align:center;color:#888;">Giỏ hàng trống!</p>`;
        return;
      }

      let total = 0;
      let html = `
        <table>
          <thead>
            <tr>
              <th>Ảnh</th>
              <th>Tên acc</th>
              <th>Giá</th>
              <th>Số lượng</th>
              <th>Thành tiền</th>
            </tr>
          </thead>
          <tbody>
      `;

      cart.forEach(item => {
        const sub = item.price * item.qty;
        total += sub;
        html += `
          <tr>
            <td><img src="${item.image}" alt="${item.name}"></td>
            <td>${item.name}</td>
            <td>${item.price.toLocaleString("vi-VN")} VND</td>
            <td>${item.qty}</td>
            <td>${sub.toLocaleString("vi-VN")} VND</td>
          </tr>
        `;
      });

      html += `
          </tbody>
        </table>
        <div class="total">Tổng cộng: ${total.toLocaleString("vi-VN")} VND</div>
      `;
      box.innerHTML = html;
    }

    // === GỬI ĐƠN HÀNG & LƯU VÀO ADMIN ===
    function submitOrder() {
      const name = document.getElementById("fullname").value.trim();
      const addr = document.getElementById("address").value.trim();
      const phone = document.getElementById("phone").value.trim();

      if (!name || !addr || !phone) {
        alert("⚠️ Vui lòng điền đầy đủ thông tin!");
        return;
      }

      if (cart.length === 0) {
        alert("Giỏ hàng trống!");
        return;
      }

      const total = cart.reduce((s, i) => s + i.price * i.qty, 0);

      // Tạo đơn hàng mới
      const order = {
        id: Date.now(),
        fullname: name,
        address: addr,
        phone: phone,
        total,
        items: cart,
        time: new Date().toLocaleString("vi-VN"),
        status: "Chờ xử lý"
      };

      // Lưu vào danh sách orders
      let orders = JSON.parse(localStorage.getItem("orders")) || [];
      orders.push(order);
      localStorage.setItem("orders", JSON.stringify(orders));

      // Xóa giỏ hàng
      localStorage.removeItem("CART");

      alert(`✅ Đặt hàng thành công! Cảm ơn ${name}.`);
      window.location.href = "Camon.html";
    }

    renderOrderSummary();
  </script>
</body>
</html>
