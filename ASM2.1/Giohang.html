<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Giỏ hàng</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
   /* ==== RESET ==== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #111;
  color: #fff;
  line-height: 1.6;
}

/* ==== HEADER MENU ==== */
header {
  background: #000;
  color: #fff;
  padding: 12px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid #fcd000;
}

header .brand a {
  font-size: 22px;
  font-weight: bold;
  color: #fcd000;
  text-decoration: none;
}

header nav a {
  color: #fff;
  text-decoration: none;
  margin: 0 14px;
  font-size: 16px;
  transition: 0.3s;
}

header nav a:hover {
  color: #fcd000;
}

/* ==== CART PAGE ==== */
main {
  padding: 30px;
}

h2 {
  color: #fcd000;
  margin-bottom: 20px;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
  background: #1b1b1b;
  border-radius: 8px;
  overflow: hidden;
}

th, td {
  padding: 12px;
  text-align: center;
  border-bottom: 1px solid #333;
}

th {
  background: #000;
  color: #fcd000;
  text-transform: uppercase;
  letter-spacing: 1px;
}

td img {
  width: 80px;
  height: 60px;
  object-fit: cover;
  border-radius: 6px;
}

button {
  padding: 6px 12px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  background: #333;
  color: #fff;
  transition: 0.3s;
}

button:hover {
  background: #fcd000;
  color: #000;
}

#cartSummary {
  margin-top: 20px;
  text-align: right;
  font-size: 18px;
}

#cartSummary strong {
  color: #fcd000;
}

#cartSummary button {
  background: #fcd000;
  color: #000;
  font-weight: bold;
  margin-left: 10px;
}

  </style>
</head>
<body>
 <header>
  <div class="brand">
    <a href="Trangchu.html">🏎 Acc free free Q$V</a>
  </div>
  <nav>
    <a href="Trangchu.html">Trang chủ</a>
    <a href="Models.html">Sản phẩm</a>
    <a href="Lienhe.html">Liên hệ</a>
    <a href="Giohang.html">🛒 Giỏ hàng (<span id="cartCount">0</span>)</a>
  </nav>
</header>


  <main style="padding:20px">
    <h2>Giỏ hàng của bạn</h2>

    <table>
      <thead>
        <tr>
          <th>Ảnh</th>
          <th>Sản phẩm</th>
          <th>Giá</th>
          <th>Số lượng</th>
          <th>Tạm tính</th>
          <th>Hành động</th>
        </tr>
      </thead>
      <tbody id="cartContainer"></tbody>
    </table>

    <div id="cartSummary"></div>
  </main>

  <script src="js/Giohang.js"></script>
</body>
</html>
