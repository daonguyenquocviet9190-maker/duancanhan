<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Admin - Quản lý sản phẩm</title>
  <link rel="stylesheet" href="admin.css">
  <script src="admin_menu.js" defer></script>
  <script src="Admin_Products.js" defer></script>
 
<link rel="stylesheet" href="admin.css">

</head>
<body>
  <main class="content">
    <h2>Quản lý sản phẩm</h2>
  </main>

  <form id="formAddProduct" class="product-form">
    <label>Tên sản phẩm</label>
    <input id="pName" required>

    <label>Giá</label>
    <input id="pPrice" type="number" required>

    <label>Danh mục</label>
    <select id="pCategory"></select>

    <label>Ảnh (chọn file hoặc nhập URL)</label>
    <input id="pImageUrl" placeholder="Dán link ảnh...">
    <input id="pImageFile" type="file" accept="image/*">
    <img id="imgPreview" class="preview" style="display:none">

    <label>Mô tả</label>
    <input id="pDesc">

    <button type="submit" class="add">Thêm sản phẩm</button>
  </form>

  <table>
    <thead>
      <tr>
        <th>Tên</th>
        <th>Giá</th>
        <th>Danh mục</th>
        <th>Ảnh</th>
        <th>Hành động</th>
      </tr>
    </thead>
    <tbody id="productTable"></tbody>
  </table>
</body>
</html>
